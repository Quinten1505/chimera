[package]
name = "chimera-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
testing = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
