[workspace]
members = ["crates/core", "crates/pipelines", "crates/github", "crates/configuration", "crates/herdr"]
default-members = [".", "crates/core", "crates/pipelines", "crates/github", "crates/configuration", "crates/herdr"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chimera-core = { path = "crates/core" }
chimera-pipelines = { path = "crates/pipelines" }
chimera-github = { path = "crates/github" }
chimera-configuration = { path = "crates/configuration" }
chimera-herdr = { path = "crates/herdr" }

[package]
name = "chimera"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chimera-core.workspace = true
chimera-pipelines.workspace = true
chimera-github.workspace = true
chimera-configuration.workspace = true
chimera-herdr.workspace = true

[dev-dependencies]
serde_json = "1"
