[workspace]
members = ["modules/core", "modules/workflow", "modules/github", "modules/configuration"]
default-members = [".", "modules/core", "modules/workflow", "modules/github", "modules/configuration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chimera-core = { path = "modules/core" }
chimera-workflow = { path = "modules/workflow" }
chimera-github = { path = "modules/github" }
chimera-configuration = { path = "modules/configuration" }

[package]
name = "chimera"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chimera-core.workspace = true
chimera-workflow.workspace = true
chimera-github.workspace = true
chimera-configuration.workspace = true
