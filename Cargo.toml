[workspace]
members = ["crates/core", "crates/workflow", "crates/github", "crates/configuration"]
default-members = [".", "crates/core", "crates/workflow", "crates/github", "crates/configuration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
chimera-core = { path = "crates/core" }
chimera-workflow = { path = "crates/workflow" }
chimera-github = { path = "crates/github" }
chimera-configuration = { path = "crates/configuration" }

[package]
name = "chimera"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
chimera-core.workspace = true
chimera-workflow.workspace = true
chimera-github.workspace = true
chimera-configuration.workspace = true

[dev-dependencies]
serde_json = "1"
